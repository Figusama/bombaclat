# Каталог типов нарушений кассовой дисциплины, наблюдаемых по видео.
# Источники: Постановление Правления НБРК от 29.11.2019 № 231 (Правила осуществления кассовых операций
# и операций по инкассации банкнот, монет и ценностей в банках...) и Постановление Правления НБРК
# от 24.02.2020 № 14 (Правила организации охраны и устройства помещений банков...).
# basis: confirmed — пункт прямо описывает требование; indirect — пункт применим по смыслу;
#        proposed — основание предложено командой, требует сверки с внутренними документами банка.

documents:
  N231:
    title: "Постановление Правления НБРК от 29.11.2019 № 231 «Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей»"
    short: "Правила НБРК № 231"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  N14:
    title: "Постановление Правления НБРК от 24.02.2020 № 14 «Правила организации охраны и устройства помещений банков»"
    short: "Правила НБРК № 14"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"

types:
  - id: stranger_in_room
    name: "Посторонний / второй человек в кассе"
    priority: Low
    in_dataset: true
    violation: "в кассовое помещение входит посторонний или второй клиент, пока кассир обслуживает другого клиента"
    normal: "в кассе только кассир и один обслуживаемый клиент; следующий входит после ухода предыдущего"
    norms:
      - doc: N14
        clause: "п. 8"
        basis: indirect
        quote: "Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом."
      - doc: N14
        clause: "п. 16 пп. 5"
        basis: indirect
        quote: "между кассами оборудуются перегородки, отделяющие кассы и соответственно рабочие места кассовых работников между собой"
      - doc: N231
        clause: "п. 75"
        basis: indirect
        quote: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег."

  - id: door_not_closed
    name: "Дверь кассы не закрыта после входа"
    priority: Medium
    in_dataset: true
    violation: "кассир входит в кассу и не закрывает за собой дверь"
    normal: "кассир входит, разворачивается и закрывает дверь"
    norms:
      - doc: N14
        clause: "п. 16 пп. 1"
        basis: confirmed
        note: "действие п. 16 приостановлено до 01.01.2027 постановлением Правления НБРК от 24.12.2024 № 88; на этот период пп. 1 действует в той же формулировке"
        quote: "каждая касса имеет отдельный вход с закрывающейся на замок дверью"
      - doc: N14
        clause: "п. 8"
        basis: confirmed
        quote: "Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом."

  - id: valuables_left_on_leave
    name: "Уход: ценности оставлены на столе"
    priority: Low
    in_dataset: true
    violation: "кассир уходит из кассы, а на столе остаются деньги, документы или инкассаторская сумка"
    normal: "перед уходом всё убрано в сейф, стол пустой"
    norms:
      - doc: N231
        clause: "п. 20"
        basis: confirmed
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
      - doc: N231
        clause: "п. 80"
        basis: proposed
        quote: "Порядок хранения, выдачи и передачи ценностей ... определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования."

  - id: laptop_not_locked
    name: "Уход: ноутбук не заблокирован"
    priority: Low
    in_dataset: true
    violation: "кассир уходит, а экран ноутбука светится с открытым рабочим окном"
    normal: "перед уходом экран заблокирован (экран блокировки); закрывать крышку не обязательно"
    norms:
      - doc: N231
        clause: "п. 2 пп. 17, п. 80"
        basis: proposed
        quote: "ценности – ... электронные (цифровые) носители, на которых хранится банковская защищаемая информация; порядок хранения ... определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования"

  - id: devices_left_on
    name: "Конец смены: устройства не выключены"
    priority: Low
    in_dataset: true
    violation: "в конце смены свет выключен, но экран ноутбука или счётная машинка продолжают светиться"
    normal: "ноутбук закрыт, машинка и свет выключены"
    norms:
      - doc: N231
        clause: "п. 2 пп. 17, п. 80"
        basis: proposed
        quote: "исключение несанкционированного использования носителей банковской защищаемой информации"

  - id: safe_key_left
    name: "Уход: ключ оставлен в сейфе"
    priority: High
    in_dataset: true
    violation: "кассир уходит, а ключ остаётся в замке сейфа"
    normal: "кассир закрывает сейф и забирает ключ"
    norms:
      - doc: N231
        clause: "п. 80"
        basis: confirmed
        quote: "Порядок хранения, выдачи и передачи ... ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования."
      - doc: N231
        clause: "п. 2 пп. 17"
        basis: indirect
        quote: "ключи (дубликаты ключей) ... относятся к ценностям"

  - id: safe_open_during_work
    name: "Сейф открыт во время работы"
    priority: Medium
    in_dataset: true
    violation: "кассир взяла деньги и села работать, оставив дверцу сейфа открытой"
    normal: "взяла деньги, закрыла сейф, потом села"
    norms:
      - doc: N231
        clause: "п. 20"
        basis: confirmed
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."

  - id: money_not_secured_before_next_client
    name: "Деньги не убраны в сейф перед следующим клиентом"
    priority: Medium
    in_dataset: true
    violation: "деньги предыдущего клиента лежат на столе, а в кассу входит следующий клиент"
    normal: "деньги убраны в сейф до ухода клиента; деньги на столе без посторонних — не нарушение"
    norms:
      - doc: N231
        clause: "п. 20"
        basis: confirmed
        quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах ... закрывающихся на ключ."

  - id: client_left_before_count
    name: "Клиент ушёл до завершения пересчёта"
    priority: Medium
    in_dataset: true
    violation: "клиент передал деньги и ушёл, а кассир продолжает пересчёт без него"
    normal: "клиент сидит у стола до конца пересчёта"
    norms:
      - doc: N231
        clause: "п. 20"
        basis: confirmed
        quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
      - doc: N231
        clause: "п. 31 пп. 4"
        basis: confirmed
        quote: "пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги"

  - id: collector_bag_no_id_check
    name: "Сумка инкассатора принята без проверки удостоверения"
    priority: Medium
    in_dataset: true
    violation: "инкассатор приносит сумку, кассир сразу её забирает без проверки удостоверения и документов"
    normal: "кассир сначала берёт и рассматривает удостоверение / препроводительный документ, затем осматривает и принимает сумку"
    norms:
      - doc: N231
        clause: "п. 24"
        basis: indirect
        quote: "Кассовые операции по приему наличных денег клиента от подразделения инкассации ... осуществляется кассовым работником банка на основании препроводительного документа ... Кассовый работник: 1) проверяет указание на препроводительном документе необходимых сведений ... 3) проверяет целостность сумки; 4) проверяет правильность пломбирования сумки."
      - doc: N231
        clause: "п. 101 пп. 1"
        basis: indirect
        quote: "выдает: 1) инкассатору-сборщику: доверенность ...; явочную карточку ...; служебное удостоверение работника подразделения инкассации"

  - id: no_client_id_check
    name: "Нет проверки удостоверения клиента"
    priority: High
    in_dataset: true
    violation: "клиент сразу передаёт деньги, документ, удостоверяющий личность, не передаётся и не проверяется"
    normal: "сначала клиент передаёт удостоверение, кассир рассматривает его несколько секунд"
    norms:
      - doc: N231
        clause: "п. 19 пп. 1"
        basis: confirmed
        quote: "проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов"
      - doc: N231
        clause: "п. 31 пп. 1"
        basis: confirmed
        quote: "проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов"

  - id: no_machine_count
    name: "Пересчёт не на счётной машинке"
    priority: High
    in_dataset: true
    violation: "деньги пересчитываются вручную (веером) или убираются в сейф без пересчёта на счётной машинке"
    normal: "деньги пересчитываются на счётной машинке; ручная сортировка после машинки — норма"
    norms:
      - doc: N231
        clause: "п. 41"
        basis: confirmed
        quote: "Банки осуществляют кассовые операции по пересчету и сортировке наличных денег на оборудовании, имеющем функцию проверки не менее двух машиночитаемых защитных признаков банкнот и монет"
      - doc: N231
        clause: "п. 19 пп. 2"
        basis: confirmed
        quote: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил"
      - doc: N231
        clause: "п. 57"
        basis: confirmed
        quote: "Банк при осуществлении кассовых операций проверяет платежность банкнот и монет в соответствии с Правилами № 230."

  - id: personal_items
    name: "Личные вещи на рабочем месте"
    priority: Low
    in_dataset: true
    violation: "на кассовом столе лежат личные вещи кассира: сумка, верхняя одежда"
    normal: "личных вещей на столе нет"
    norms:
      - doc: N231
        clause: "п. 12"
        basis: confirmed
        note: "в редакции постановления Правления НБРК от 10.11.2025 № 71"
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."

  - id: food_drink
    name: "Еда и напитки на рабочем месте"
    priority: Low
    in_dataset: true
    violation: "на кассовом столе еда или напитки, кассир ест или пьёт"
    normal: "еды и напитков на столе нет"
    norms:
      - doc: N231
        clause: "п. 12"
        basis: indirect
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."

  - id: transfer_outside_procedure
    name: "Передача денег клиенту вне процедуры"
    priority: High
    in_dataset: true
    violation: "после пересчёта принятые деньги отдаются обратно клиенту, сейф не открывается, документ не выдаётся"
    normal: "принятые деньги убираются в сейф, клиенту выдаётся подтверждающий документ"
    norms:
      - doc: N231
        clause: "п. 19 пп. 4–6"
        basis: indirect
        quote: "сверяет соответствие суммы ...; подписывает все экземпляры приходного кассового документа ...; выдает клиенту документ, подтверждающий проведение кассовой операции по приему наличных денег"
      - doc: N231
        clause: "п. 26"
        basis: indirect
        quote: "Наличные деньги, принятые от клиента в течение рабочего дня зачисляются на банковские счета клиентов в тот же рабочий день."

  - id: cashier_left_during_service
    name: "Кассир покинул рабочее место во время обслуживания клиента"
    priority: Low
    in_dataset: false
    violation: "клиент сидит у стола, а кассир встаёт и уходит из кассы / отходит, оставив клиента одного"
    normal: "кассир остаётся на месте до ухода клиента"
    norms:
      - doc: N231
        clause: "п. 22"
        basis: confirmed
        quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."

  - id: phone_with_camera
    name: "Телефон / устройство с камерой в кассе"
    priority: Low
    in_dataset: false
    violation: "у кассира в руке смартфон или смартфон лежит на кассовом столе; съёмка денег или документов"
    normal: "смартфона у кассира нет"
    norms:
      - doc: N231
        clause: "п. 12"
        basis: confirmed
        quote: "Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."

  - id: cash_out_without_count
    name: "Выдача денег без пересчёта при клиенте"
    priority: High
    in_dataset: false
    violation: "кассир достаёт деньги из сейфа и сразу передаёт клиенту без пересчёта у него на глазах"
    normal: "пересчёт на машинке при клиенте, затем передача"
    norms:
      - doc: N231
        clause: "п. 31 пп. 4"
        basis: confirmed
        quote: "пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги"

  - id: client_left_without_recount
    name: "Клиент ушёл, не пересчитав выданные деньги"
    priority: Medium
    in_dataset: false
    violation: "клиент получает пачку денег и сразу уходит от кассы, не пересчитывая"
    normal: "клиент пересчитывает деньги у стола кассира, потом уходит"
    norms:
      - doc: N231
        clause: "п. 35"
        basis: confirmed
        quote: "Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или в помещении для пересчета наличных денег клиентами в присутствии кассового работника или контролирующего работника."

  - id: damaged_bag_opened_without_collector
    name: "Вскрытие повреждённой сумки без инкассатора"
    priority: High
    in_dataset: false
    violation: "сумка с видимым повреждением вскрывается кассиром после ухода инкассатора или без него"
    normal: "приём сумки при инкассаторе с осмотром"
    norms:
      - doc: N231
        clause: "п. 25"
        basis: confirmed
        quote: "В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности."

  - id: bag_opened_without_inspection
    name: "Сумка вскрыта без осмотра целостности и пломбы"
    priority: High
    in_dataset: false
    violation: "кассир сразу режет/открывает инкассаторскую сумку, не осматривая пломбу и целостность"
    normal: "кассир осматривает сумку и пломбу, затем вскрывает"
    norms:
      - doc: N231
        clause: "п. 24 пп. 3–4"
        basis: confirmed
        quote: "Кассовый работник: 3) проверяет целостность сумки; 4) проверяет правильность пломбирования сумки."

  - id: stranger_near_safe
    name: "Посторонний у сейфа / в сейфовой комнате"
    priority: Medium
    in_dataset: false
    violation: "клиент или посторонний подходит к сейфу, открывает его или находится рядом с открытым сейфом"
    normal: "к сейфу подходит только кассир"
    norms:
      - doc: N231
        clause: "п. 75"
        basis: confirmed
        quote: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег."

  - id: safe_key_handed_or_unattended
    name: "Ключ от сейфа передан другому / оставлен без присмотра"
    priority: High
    in_dataset: false
    violation: "кассир отдаёт ключ другому человеку или кладёт ключ на стол и уходит"
    normal: "кассир забирает ключ с собой"
    norms:
      - doc: N231
        clause: "п. 76"
        basis: confirmed
        quote: "Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся у лиц, ответственных за сохранность наличных денег."
      - doc: N231
        clause: "п. 80"
        basis: confirmed
        quote: "Порядок хранения, выдачи и передачи ... ключей от специальных устройств, находящихся на рабочем месте кассового работника ... определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования."

  - id: collection_with_strangers
    name: "Инкассация при посторонних"
    priority: Medium
    in_dataset: false
    violation: "приём/вскрытие инкассаторской сумки, пока в кассе находится клиент или посторонний"
    normal: "при приёме сумки посторонних нет"
    norms:
      - doc: N14
        clause: "п. 21 ч. 2"
        basis: proposed
        note: "трактовка по аналогии, требует проверки применимости к кассе"
        quote: "обеспечивается ограничение доступа и просмотра третьими лицами за осуществлением инкассации банкнот, монет и ценностей"

  - id: door_open_during_operations
    name: "Дверь кассы открыта во время операций"
    priority: Medium
    in_dataset: false
